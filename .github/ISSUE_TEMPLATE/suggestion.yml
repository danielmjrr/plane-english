name: Suggestion
description: Ask for a new feature or a change.
labels: [suggestion]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to change
      description: Tell us which replies are hard to read or act on, with an example if you can.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Which rule do you want to add, change, or remove?
